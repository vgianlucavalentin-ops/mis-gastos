<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#161618">
<title>Mis gastos</title>
<style>
:root{--bg:#161618;--card:#1e1e21;--muted:#252528;--border:#36363a;--text:#f2f2f4;--sub:#a9a9af;--blue:#6b93ff;--green:#4fbe8d;--red:#e87a7a;--purple:#b48ae0;--orange:#e0a15d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.45}button,input,select{font:inherit;color:inherit}button{cursor:pointer}.app{max-width:720px;margin:auto;padding:20px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.title{font-size:22px;font-weight:650}.actions{display:flex;gap:8px}.btn,.iconbtn{background:transparent;border:1px solid var(--border);border-radius:10px;padding:9px 12px}.btn:hover,.iconbtn:hover{background:var(--muted)}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin-bottom:18px}.label{font-size:13px;color:var(--sub)}.total{font-size:42px;font-weight:650;letter-spacing:-1px}.month{display:flex;align-items:center;gap:8px}.nav{width:38px;height:38px;padding:0;border:1px solid var(--border);background:transparent;border-radius:10px}.monthname{min-width:150px;text-align:center;font-weight:600;text-transform:capitalize}.card{border:1px solid var(--border);background:var(--card);border-radius:14px;padding:16px;margin-bottom:16px}.card h2{font-size:15px;margin:0 0 13px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}.field{background:var(--muted);border:1px solid var(--border);border-radius:10px;padding:11px 12px;width:100%;outline:none}.field:focus{border-color:#666}.primary{width:100%;border:0;border-radius:10px;padding:12px;background:var(--text);color:var(--bg);font-weight:650;margin-top:10px}.tabs{display:flex;gap:7px;margin:4px 0 14px}.tab{border:1px solid transparent;background:transparent;color:var(--sub);padding:8px 14px;border-radius:9px}.tab.active{background:var(--muted);border-color:var(--border);color:var(--text)}.tablewrap{overflow:auto}.empty{text-align:center;color:#666;padding:35px 10px}.table{width:100%;border-collapse:collapse;min-width:560px}.table th{font-size:12px;color:var(--sub);font-weight:450;text-align:left;padding:6px 8px;border-bottom:1px solid var(--border)}.table td{padding:9px 8px;border-bottom:1px solid var(--border)}.right{text-align:right}.chip{display:inline-flex;align-items:center;gap:6px;background:#293044;padding:3px 9px;border-radius:7px;font-size:12px}.dot{width:7px;height:7px;border-radius:50%;display:inline-block}.danger{color:var(--red)}.positive{color:var(--green)}.accountgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.account{border:1px solid var(--border);border-radius:13px;padding:14px;background:var(--card)}.account .name{color:var(--sub);font-size:13px}.balance{font-size:24px;font-weight:650;margin:5px 0 10px}.account button{width:100%;background:var(--muted);border:1px solid var(--border);border-radius:8px;padding:8px;margin-top:6px}.mini{font-size:12px;color:var(--sub)}.sectionTitle{font-size:14px;font-weight:600;margin:18px 0 9px}.barrow{display:grid;grid-template-columns:105px 1fr 75px;align-items:center;gap:8px;margin:9px 0}.barbg{height:12px;background:var(--muted);border-radius:99px;overflow:hidden}.bar{height:100%;border-radius:99px}.chartbox{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}.bars{height:150px;display:flex;align-items:flex-end;gap:5px;border-bottom:1px solid var(--border);padding:0 3px}.daycol{flex:1;display:flex;align-items:flex-end;height:100%}.daybar{width:100%;border-radius:4px 4px 0 0;background:var(--blue);min-height:2px}.days{display:flex;gap:5px;font-size:10px;color:var(--sub);padding-top:5px}.days span{flex:1;text-align:center}.hidden{display:none!important}.flash{font-size:13px;margin-top:8px;color:var(--green)}@media(max-width:600px){.app{padding:14px 12px 40px}.top{align-items:flex-start}.actions .btn{font-size:12px;padding:8px}.hero{display:block}.month{margin-top:14px;justify-content:center}.accountgrid{grid-template-columns:1fr}.grid2,.grid3{grid-template-columns:1fr}.total{font-size:38px}.monthname{min-width:130px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="title">Mis gastos</div><div class="actions"><button class="btn" id="exportBtn">Respaldo CSV</button><button class="btn" id="importBtn">Importar</button><input id="fileInput" type="file" accept=".csv" hidden></div></div>
  <div class="hero"><div><div class="label">Total gastado este mes</div><div class="total" id="monthTotal">S/ 0.00</div><div class="label" id="monthCount">0 gastos registrados</div></div><div class="month"><button class="nav" id="prev">‹</button><div class="monthname" id="monthName"></div><button class="nav" id="next">›</button></div></div>

  <div class="card">
    <h2>➖ Añadir gasto</h2>
    <div class="grid2"><input class="field" id="amount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Monto (S/)"/><input class="field" id="date" type="date"/></div>
    <div class="grid2" style="margin-top:9px"><select class="field" id="category"><option>Comida</option><option>Transporte</option><option>Hogar</option><option>Ocio</option><option>Salud</option><option>Otros</option></select><select class="field" id="source"></select></div>
    <input class="field" id="note" style="margin-top:9px" maxlength="80" placeholder="¿En qué lo gastaste? (opcional)"/>
    <button class="primary" id="addExpense">＋ Guardar gasto</button><div id="expenseMsg" class="flash"></div>
  </div>

  <div class="tabs"><button class="tab active" data-tab="registro">Registro</button><button class="tab" data-tab="cuentas">💳 Cuentas</button><button class="tab" data-tab="graficos">📊 Gráficos</button></div>

  <section id="registro"><div class="card"><div class="tablewrap" id="table"></div></div></section>

  <section id="cuentas" class="hidden">
    <div class="accountgrid" id="accountCards"></div>
    <div class="card"><h2>➕ Crear cuenta</h2><div class="grid2"><input class="field" id="newName" placeholder="Nombre, ej. Ahorros"/><input class="field" id="newBalance" type="number" min="0" step="0.01" placeholder="Saldo inicial (S/)"/></div><button class="primary" id="addAccount">Crear cuenta</button></div>
    <div class="card"><h2>💰 Reponer / agregar dinero</h2><div class="grid3"><select class="field" id="depositAccount"></select><input class="field" id="depositAmount" type="number" min="0" step="0.01" placeholder="Monto (S/)"/><input class="field" id="depositNote" placeholder="Motivo (opcional)"/></div><button class="primary" id="depositBtn">Agregar dinero</button></div>
    <div class="card"><h2>🔄 Transferir entre cuentas</h2><div class="grid3"><select class="field" id="fromAccount"></select><select class="field" id="toAccount"></select><input class="field" id="transferAmount" type="number" min="0" step="0.01" placeholder="Monto (S/)"/></div><button class="primary" id="transferBtn">Transferir</button></div>
  </section>

  <section id="graficos" class="hidden"><div class="chartbox"><div class="sectionTitle">Gasto por categoría</div><div id="catChart"></div></div><div class="chartbox"><div class="sectionTitle">Gasto por cuenta</div><div id="accountChart"></div></div><div class="chartbox"><div class="sectionTitle">Gasto por día</div><div class="bars" id="dayBars"></div><div class="days" id="dayLabels"></div></div></section>
</div>
<script>
(function(){
const EXP='mis-gastos-v2-expenses', ACC='mis-gastos-v2-accounts';
const colors={Comida:'#6b93ff',Transporte:'#e87a7a',Hogar:'#b48ae0',Ocio:'#4fbe8d',Salud:'#e0a15d',Otros:'#98989d'};
let expenses=JSON.parse(localStorage.getItem(EXP)||'[]');
let accounts=JSON.parse(localStorage.getItem(ACC)||'null');
if(!accounts){accounts=[{id:'prestamos',name:'Préstamos',balance:0},{id:'pension',name:'Pensión',balance:0},{id:'propinas',name:'Propinas',balance:0}];saveAccounts()}
// Migrate old Kimi expenses if they exist.
try{const old=JSON.parse(localStorage.getItem('mis-gastos-v1')||'[]');if(old.length&&!expenses.length){expenses=old.map(e=>({...e,source:'propinas'}));saveExpenses()}}catch(e){}
let view=new Date();view.setDate(1);const money=new Intl.NumberFormat('es-PE',{style:'currency',currency:'PEN',minimumFractionDigits:2});const fmtMonth=new Intl.DateTimeFormat('es-PE',{month:'long',year:'numeric'});const fmtDay=new Intl.DateTimeFormat('es-PE',{day:'numeric',month:'short'});
const $=id=>document.getElementById(id);function saveExpenses(){localStorage.setItem(EXP,JSON.stringify(expenses))}function saveAccounts(){localStorage.setItem(ACC,JSON.stringify(accounts))}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}function current(){return expenses.filter(e=>{const d=new Date(e.date+'T00:00:00');return d.getFullYear()===view.getFullYear()&&d.getMonth()===view.getMonth()})}function account(id){return accounts.find(a=>a.id===id)}function setOptions(id,includeAll=false){const s=$(id);s.innerHTML=(includeAll?'<option value="all">Todas</option>':'')+accounts.map(a=>`<option value="${a.id}">${esc(a.name)} — ${money.format(a.balance)}</option>`).join('')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function refreshSelects(){['source','depositAccount','fromAccount','toAccount'].forEach(id=>setOptions(id));$('toAccount').value=accounts.find(a=>a.id!==$('fromAccount').value)?.id||accounts[0]?.id;}
function render(){
 $('monthName').textContent=fmtMonth.format(view);const list=current();const total=list.reduce((s,e)=>s+e.amount,0);$('monthTotal').textContent=money.format(total);$('monthCount').textContent=`${list.length} ${list.length===1?'gasto registrado':'gastos registrados'}`;
 if(!list.length){$('table').innerHTML='<div class="empty">Sin gastos en este mes</div>'}else{$('table').innerHTML=`<table class="table"><thead><tr><th>Fecha</th><th>Categoría</th><th>Descripción</th><th>Cuenta</th><th class="right">Monto</th><th></th></tr></thead><tbody>${list.sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<tr><td>${fmtDay.format(new Date(e.date+'T00:00:00'))}</td><td><span class="chip"><span class="dot" style="background:${colors[e.category]||colors.Otros}"></span>${esc(e.category)}</span></td><td>${esc(e.note||'—')}</td><td>${esc(account(e.source)?.name||'Sin cuenta')}</td><td class="right">${money.format(e.amount)}</td><td><button class="iconbtn danger" data-del="${e.id}">×</button></td></tr>`).join('')}</tbody></table>`}
 renderAccounts();renderCharts();refreshSelects();
}
function renderAccounts(){$('accountCards').innerHTML=accounts.map(a=>{const spent=expenses.filter(e=>e.source===a.id).reduce((s,e)=>s+e.amount,0);return `<div class="account"><div class="name">${esc(a.name)}</div><div class="balance">${money.format(a.balance)}</div><div class="mini">Gastado histórico: ${money.format(spent)}</div><button data-deposit="${a.id}">＋ Agregar dinero</button></div>`}).join('')}
function renderCharts(){const list=current();const byCat={};list.forEach(e=>byCat[e.category]=(byCat[e.category]||0)+e.amount);const maxCat=Math.max(1,...Object.values(byCat));$('catChart').innerHTML=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div class="barrow"><span>${esc(n)}</span><div class="barbg"><div class="bar" style="width:${v/maxCat*100}%;background:${colors[n]||colors.Otros}"></div></div><span class="right">${money.format(v)}</span></div>`).join('')||'<div class="empty">Aún no hay gastos.</div>';
 const byAcc={};list.forEach(e=>{const n=account(e.source)?.name||'Sin cuenta';byAcc[n]=(byAcc[n]||0)+e.amount});const maxA=Math.max(1,...Object.values(byAcc));$('accountChart').innerHTML=Object.entries(byAcc).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div class="barrow"><span>${esc(n)}</span><div class="barbg"><div class="bar" style="width:${v/maxA*100}%;background:var(--purple)"></div></div><span class="right">${money.format(v)}</span></div>`).join('')||'<div class="empty">Aún no hay gastos.</div>';
 const days=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();let vals=Array(days).fill(0);list.forEach(e=>vals[+e.date.slice(8)-1]+=e.amount);const maxD=Math.max(1,...vals);$('dayBars').innerHTML=vals.map(v=>`<div class="daycol"><div class="daybar" style="height:${Math.max(2,v/maxD*100)}%" title="${money.format(v)}"></div></div>`).join('');$('dayLabels').innerHTML=vals.map((_,i)=>`<span>${i+1}</span>`).join('');}
function msg(t){$('expenseMsg').textContent=t;setTimeout(()=>$('expenseMsg').textContent='',2200)}
$('date').value=new Date().toISOString().slice(0,10);$('addExpense').onclick=()=>{const amount=Number($('amount').value),source=$('source').value;if(!(amount>0))return msg('Ingresa un monto válido.');const a=account(source);if(!a)return msg('Selecciona una cuenta.');if(a.balance<amount)return msg(`Saldo insuficiente en ${a.name}.`);a.balance=Math.round((a.balance-amount)*100)/100;expenses.push({id:uid(),amount,date:$('date').value,category:$('category').value,note:$('note').value.trim(),source});saveAccounts();saveExpenses();$('amount').value='';$('note').value='';msg(`Gasto guardado. ${a.name}: ${money.format(a.balance)}`);render()};
$('prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};$('next').onclick=()=>{view.setMonth(view.getMonth()+1);render()};
$('table').addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(!b)return;const x=expenses.find(v=>v.id===b.dataset.del);if(!x)return;const a=account(x.source);if(a)a.balance=Math.round((a.balance+x.amount)*100)/100;expenses=expenses.filter(v=>v.id!==x.id);saveAccounts();saveExpenses();render()});
$('addAccount').onclick=()=>{const name=$('newName').value.trim(),balance=Number($('newBalance').value)||0;if(!name)return;accounts.push({id:uid(),name,balance:Math.max(0,balance)});saveAccounts();$('newName').value='';$('newBalance').value='';render()};
$('depositBtn').onclick=()=>{const a=account($('depositAccount').value),n=Number($('depositAmount').value);if(!a||!(n>0))return; a.balance=Math.round((a.balance+n)*100)/100;saveAccounts();$('depositAmount').value='';$('depositNote').value='';render()};
$('transferBtn').onclick=()=>{const from=account($('fromAccount').value),to=account($('toAccount').value),n=Number($('transferAmount').value);if(!from||!to||from.id===to.id||!(n>0)||from.balance<n)return;from.balance=Math.round((from.balance-n)*100)/100;to.balance=Math.round((to.balance+n)*100)/100;saveAccounts();$('transferAmount').value='';render()};
$('accountCards').addEventListener('click',e=>{const b=e.target.closest('[data-deposit]');if(b){$('depositAccount').value=b.dataset.deposit;document.querySelector('[data-tab="cuentas"]').click();$('depositAmount').focus()}});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');['registro','cuentas','graficos'].forEach(id=>$(id).classList.toggle('hidden',id!==b.dataset.tab));render()});
$('fromAccount').onchange=()=>{const other=accounts.find(a=>a.id!==$('fromAccount').value);if(other)$('toAccount').value=other.id};
$('exportBtn').onclick=()=>{const rows=[['fecha','categoria','descripcion','cuenta','monto'],...expenses.map(e=>[e.date,e.category,(e.note||'').replace(/"/g,'""'),account(e.source)?.name||'',e.amount.toFixed(2)])];const blob=new Blob(['\ufeff'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mis-gastos-respaldo.csv';a.click();URL.revokeObjectURL(a.href)};
$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=()=>{const f=$('fileInput').files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const lines=String(r.result).replace(/^\ufeff/,'').split(/\r?\n/).filter(Boolean);let n=0;for(let i=1;i<lines.length;i++){const p=lines[i].split(',').map(x=>x.replace(/^"|"$/g,''));if(p.length<5||!/\d{4}-\d{2}-\d{2}/.test(p[0]))continue;const a=accounts.find(x=>x.name===p[3]);if(!a)continue;const amount=Number(p[4]);if(!(amount>0))continue;expenses.push({id:uid(),date:p[0],category:p[1]||'Otros',note:p[2]||'',source:a.id,amount});n++}saveExpenses();render();msg(`${n} gastos importados.`)};r.readAsText(f)};
refreshSelects();render();
})();
</script>
</body></html>
